[project]
name = "ripper"
version = "0.1.0"
description = "Rip DVDs from the command-line"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Russ Jester"}
]
dependencies = []

[project.scripts]
ripper = "ripper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
