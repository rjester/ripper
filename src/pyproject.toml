[project]
name = "ripper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.21.0",
]

[project.scripts]
# Installable console script that launches the CLI. After installing the package,
# users can run `ripper` to invoke the command.
ripper = "src.cli:cli"
# Use a `main` wrapper entrypoint to allow clearer startup logic.
ripper = "src.cli:main"
