[project]
name = "ripper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.21.0",
    "rich>=12.0",
    "tomli>=2.0",
    "tomli-w>=0.6",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
# Use a `main` wrapper entrypoint to allow clearer startup logic.
ripper = "ripper.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
