name: CI

on:
  push:
    branches: [ main, Feature/initial ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] || pip install -e .
      - name: Run tests
        run: |
          python -m pytest -q
